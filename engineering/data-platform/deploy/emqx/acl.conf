%% Mosaic EMQX ACL(设计文档 §8.2: 设备只能 pub 自己的 topic, 防伪造他人数据)
%% 规则按顺序匹配, 首条命中即生效; 未命中走 no_match=deny(emqx.conf)。

%% ── 生产形态(8883, TLS + 一车一密): 只能发布 ov/{自己的VIN}/# ──
%%
%% ⚠️ 身份锚点必须是 ${username} 而不是 ${clientid}(安全):
%%   clientid 是**客户端自报**的(MQTT CONNECT 报文里随便填), 而这里的认证
%%   (password_based + built_in_database, user_id_type = username)绑定的是 **username=VIN**。
%%   用 ${clientid} 时, 设备只要把 clientid 改成**别人的 VIN**、username 仍是自己,
%%   就能发布 ov/{他人VIN}/# —— topic-VIN 这道身份锚点(网关/codec 两端刚补齐的那道)
%%   在 MQTT 授权层被整个绕过, 等于可以冒充他人车辆写数据。
%%   换成 ${username} 后, 授权锚点 = 已认证身份, 不可伪造。
%%   (占位符语法见 EMQX 授权文档: 主题占位符支持 ${clientid} / ${username} / ${client_attrs.NAME})
%%
%% 为什么仍保留 clientid 一条: EMQX 5.x 的 password_based 认证**不强制**携带 username,
%% 若将来有设备只填 clientid, 上面的规则不会命中(它是按 username 匹配的), 会走 no_match=deny
%% —— 这是**故意的 fail-closed**: 宁可拒掉, 也不能退回"凭自报身份授权"。
{allow, all, publish, ["ov/${username}/#"]}.

%% ── dev 形态(1883 内网匿名联调): clientid=dev-*, 放行 ov/# ──
%%
%% 为什么 dev 分支保留 `ov/#`(而不是收窄到 ov/dev-*/#): 内网 1883 的定位就是"用**业务 VIN**
%% 直接联调"(文档示例集 §1 的 `ov/OV90000001/status` 就是这么发的), 收窄会要求
%% 模拟器/示例全部改成 `dev-{VIN}` 命名空间 —— 那是文档与工具链的契约改动, 不在本次范围内。
%% 该路径的暴露面已由端口绑定约束: compose 把 1883 绑在 127.0.0.1, 且**生产红线**要求
%% 开放公网前去掉这条 dev 例外(见 ingest/README 生产加固清单)。
{allow, {clientid, {re, "^dev-"}}, publish, ["ov/#"]}.
