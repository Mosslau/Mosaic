apiVersion: 1

# deleteDatasources: 一次性迁移用。已 provision 过的数据源**不能直接改 uid** —— Grafana 会按新 uid
# 找不到旧记录, provisioning 失败并让 Grafana 起不来(crash loop: "data source not found");
# 故先按名字删旧记录再重建(对"已是新 uid"的环境幂等)。
deleteDatasources:
  - name: ClickHouse
    orgId: 1

datasources:
  - name: ClickHouse
    # 固定 uid: 面板/告警按 uid 引用数据源; 不固定则每次重建 /var/lib/grafana 都会生成新 uid → 断链
    # (prometheus.yaml 同样固定为 mosaic-prometheus)
    uid: mosaic-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      # host 是**必须项**: ClickHouse 插件(实测 v4.21.3)不看 Grafana 的 `url`, 只认 jsonData.host,
      # 缺了它查询直接报 `[config] invalid server host`。
      host: clickhouse
      defaultDatabase: mosaic
      port: 8123
      protocol: http
      username: ov_admin
    secureJsonData:
      password: ov_pass_2026
    isDefault: true
    editable: true
