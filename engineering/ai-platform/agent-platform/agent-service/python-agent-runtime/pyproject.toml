[project]
name = "data-agent-runtime"
version = "0.1.0"
description = "Python DeepAgents runtime for the data intelligence assistant platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7,<0.8",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain-mcp-adapters>=0.1,<1.0",
    "langchain-openai>=0.3,<2.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "langgraph-checkpoint-postgres>=3,<4",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<8.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
data-agent-runtime = "data_agent_runtime.main:main"
data-agent-worker = "data_agent_runtime.worker_main:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]
