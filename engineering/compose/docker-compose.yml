name: mosaic-base

# 共享 D0 底座：两个平台共用同一套 Kafka / PG / Redis / Prometheus / Grafana / MinIO / Vault。
# 端口全部避开本机已有栈（5432/6379/9090/3000 已被占用）：
#   Kafka 19092 · PG 15432 · Redis 16379 · Prometheus 19090 · Grafana 13000
#   MinIO 19000/19001 · Vault 18200
# 7 个服务默认全部启动（MinIO / Vault 为必选依赖，不再用 profile 隔离）。

services:
  kafka:
    image: apache/kafka:4.4.0
    container_name: mosaic-kafka
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: mosaic-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: mosaic
      POSTGRES_USER: mosaic
      POSTGRES_PASSWORD: mosaic
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mosaic -d mosaic"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    container_name: mosaic-redis
    ports:
      - "16379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: mosaic-prometheus
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.3.1
    container_name: mosaic-grafana
    ports:
      - "13000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: mosaic
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  # 对象存储（过渡态）：Iceberg 湖 / 语料 / Skill 包 / 归档的落盘层（数据平台 D2、AI 平台 D2/D4 依赖）
  # 目标形态：自建 RustFS 或云 S3/OSS（S3 API，切换只改 endpoint/凭据），见数据平台 D2。
  # 镜像说明：MinIO 自 2025-10 起停止发布社区版镜像（Docker Hub 下架、Quay 401），
  # 这里用 Bitnami 归档构建（同源二进制，2025.4.22）作过渡，不再指望上游更新。
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    container_name: mosaic-minio
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: mosaic
      MINIO_ROOT_PASSWORD: mosaic123
      MINIO_DEFAULT_BUCKETS: mosaic
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # 凭据：PG/Redis/Kafka 连接串、模型 API Key 的唯一来源（两平台共用）
  # 当前为 dev 模式（内存态、root token），只用于本地；生产化见 D10/D12。
  vault:
    image: hashicorp/vault:1.18
    container_name: mosaic-vault
    command: ["server", "-dev", "-dev-root-token-id=root"]
    ports:
      - "18200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  kafka-data:
  pg-data:
  redis-data:
  prom-data:
  grafana-data:
  minio-data:
