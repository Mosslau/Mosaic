global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # D1 dummy 服务（本机 18080，容器内经 host.docker.internal 访问）。
  # 服务未启动时该 target 为 down，不影响 D0 判定。
  - job_name: mosaic-dummy
    static_configs:
      - targets: ["host.docker.internal:18180", "host.docker.internal:18181"]
