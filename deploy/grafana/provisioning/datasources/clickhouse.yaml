apiVersion: 1

# deleteDatasources: 为 uid 变更做一次性迁移。
# 背景(2026-09-18 实测): 已 provision 过的数据源**不能直接改 uid** —— Grafana 会按新 uid
# 找不到旧记录, provisioning 失败并让 Grafana 起不来(实测 crash loop 53 次:
# "Datasource provisioning error: data source not found")。本文件此前没有 uid,
# Grafana 自动生成了一个随机 uid; 现固定为 ov-clickhouse, 故先按名字删旧记录再重建。
# Grafana 会在创建同名前先执行删除, 因此这条指令对"已是新 uid"的环境是幂等的。
deleteDatasources:
  - name: ClickHouse
    orgId: 1

datasources:
  - name: ClickHouse
    # 固定 uid: 面板/告警按 uid 引用数据源; 不固定则每次重建 /var/lib/grafana 都会生成新 uid → 断链
    # (prometheus.yaml 同样固定为 ov-prometheus)
    uid: ov-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      # host 是**必须项**: ClickHouse 插件(实测 v4.21.3)不看 Grafana 的 `url`, 只认 jsonData.host,
      # 缺了它查询直接报 `[config] invalid server host`。此前的 provisioning 只写了 url+port+protocol,
      # 而首批面板全是 Prometheus 的, 于是这个洞一直没暴露(2026-09-20 做第一个 CH 面板时才炸出来)。
      host: clickhouse
      defaultDatabase: oceanverse
      port: 8123
      protocol: http
      username: ov_admin
    secureJsonData:
      password: ov_pass_2026
    isDefault: true
    editable: true
