apiVersion: 1

datasources:
  - name: ClickHouse
    # 固定 uid: 面板/告警按 uid 引用数据源, 不固定则每次重建 /var/lib/grafana 都会生成新 uid → 断链
    # (prometheus.yaml 同样固定为 ov-prometheus)
    uid: ov-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    url: http://clickhouse:8123
    jsonData:
      defaultDatabase: oceanverse
      port: 8123
      protocol: http
      username: ov_admin
    secureJsonData:
      password: ov_pass_2026
    isDefault: true
    editable: true
