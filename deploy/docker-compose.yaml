name: oceanverse

# OceanVerse 第 1 阶段 最小可用链路基础设施
# 组件: Kafka(KRaft 单节点) + ClickHouse + MinIO + EMQX + Prometheus + Grafana
#       + MySQL + Redis (八组件)
# 用法: cd deploy && docker compose up -d
# 注意: 使用 Rancher Desktop(moby) 运行, 非 Docker Desktop
#
# 2026-09-18 审计整改:
#   ① 宿主端口一律绑 127.0.0.1 —— 这些服务是**本地开发**环境且含弱口令/无认证组件,
#      绑 0.0.0.0 会在接入公司网/公共网时把 ClickHouse/MinIO/Grafana/EMQX/Kafka 暴露给同网段。
#      容器间通信不受影响(走 ov-net, 用服务名: kafka:9092)。
#   ② 全部加 restart: unless-stopped —— 此前零 restart 策略, VM/引擎重启后容器保持 Exited,
#      链路静默下线且无告警(2026-09-18 实测: dockerd 掉线后必须人工 up -d)。
#   ③ 加资源上限 + 日志轮转 —— Rancher VM 6GB/2CPU 且空载已占 84%, 无上限会整机崩溃。
#   ④ Kafka 显式 KAFKA_LOG_DIRS —— 镜像默认 log.dirs=/tmp/kafka-logs(容器可写层),
#      此前挂载的 kafka_data 卷是死配置, down+up 即丢全部 topic 与消费位移。
#   ⑤ MySQL + Redis 就位(第九轮) —— 第 1 阶段第 4 步 Java 微服务 ×5 的底座(档案/电池/故障码/
#      告警规则/指标 都要 MySQL + Redis 缓存)。第 1 阶段只拉起实例并建库, **不建业务表**:
#      各服务的 DDL 是第 4 步的产物, 现在造表是空转。
#   ⑥ 内存预算（2026-09-20 两轮）—— 第一轮: 第九轮补齐 MySQL/Redis 后八容器合计 6.88 GiB >
#      VM 实测 6.2 GiB(上限之和超过物理内存), 按"合计 ≤ 4.5 GiB"压回, 并给 ClickHouse/Redis 加进程内上限。
#      第二轮(同日): ① **VM 提到 8 GB**(`rdctl set --virtual-machine.memory-in-gb 8`, 实测 MemTotal 7933 MiB)
#      —— 给 ClickHouse 留出真实工作空间, 并为第 3 步 Flink(JM+TM ≈1536 MiB)预留;
#      ② 按**实测用量**把闲置容器的额度腾给 ClickHouse(1280m→2560m): 旧配置的进程内上限(953 MiB)
#      只比 ClickHouse 的进程地板(重启后 ≈830~870 MiB)高约 100 MiB, 跑久后 RSS 爬到 1.16 GiB 就越限,
#      OvercommitTracker 随即拒绝一切要内存的查询(连 count() 都拒, 而 SELECT 1 正常 —— "活着但干不了活")。
#      mem_limit 只会在 cgroup 层硬杀(表现为反复重启); 进程内上限让它自己拒绝/淘汰而不是被杀。
#      门禁: scripts/check-compose-budget.sh 核对"合计 vs 预算/VM 容量 + 成对约束 + 缓存边界 + 文档数字", 改 limits 后必须复跑。

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------- 消息总线 ----------
  kafka:
    image: apache/kafka:3.9.1
    container_name: ov-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:19092:19092"   # 宿主机访问(开发调试用)
      - "127.0.0.1:9092:9092"     # 容器网络内访问
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 注意: 本镜像只认 CLUSTER_ID(不带 KAFKA_ 前缀); 写 KAFKA_CLUSTER_ID 会被忽略并回落
      # 到镜像默认值(实测日志: CLUSTER_ID not set. Setting it to default value ...)。
      CLUSTER_ID: oceanverse-kraft-cluster-01
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 持久性档(2026-09-18 升级): 客户端已全部改 RequiredAcks=RequireAll。
      # 单 broker 下 ISR={leader} → acks=all 与 acks=1 **在断电场景等价**;
      # 而 min.insync.replicas 只能设 1 —— 设 2 会让 ISR 永远凑不齐、**写入全部失败**。
      # 所以本地这组配置**不提供断电级持久性**, 它提供的是"代码不再依赖单副本假设"的语义正确性;
      # 真正的断电级保证需要多 broker: default.replication.factor>=2 + min.insync.replicas>=2
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # 数据目录必须显式指定为**被挂载的卷**: 镜像默认 /tmp/kafka-logs 在容器可写层,
      # 卷会是空的, 容器重建即丢 topic 与位移(2026-09-18 审计实测确认)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 堆上限防 VM 被 Kafka 吃穿(VM 总 6GB, 空载已占 84%)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    # 640m: 堆上限 512m(见 KAFKA_HEAP_OPTS) + 页缓存/元数据余量。
    # 实测用量 ~537 MiB(2026-09-20), 故从 768m 收到 640m, 腾出的额度给 ClickHouse(见文件头 ⑥)
    mem_limit: 640m
    logging: *default-logging
    networks: [ov-net]

  # ---------- OLAP 查询加速层 (serving) ----------
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: ov-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"     # HTTP 接口
      - "127.0.0.1:9000:9000"     # native 协议
    environment:
      CLICKHOUSE_DB: oceanverse
      CLICKHOUSE_USER: ov_admin
      CLICKHOUSE_PASSWORD: ov_pass_2026
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # 注意: 内存上限**不能**用环境变量设 —— 官方镜像只映射它认识的那批 CLICKHOUSE_*,
      # 实测 CLICKHOUSE_MAX_SERVER_MEMORY_USAGE 进了容器环境但完全没生效。
      # 正确落点是挂载配置文件: ./clickhouse/config.d/limits.xml(见该文件注释)
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      # 内存上限(2026-09-20): 镜像默认"可用内存的 90%"在共享 VM 上等于没有上限
      - ./clickhouse/config.d/limits.xml:/etc/clickhouse-server/config.d/limits.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # 2560m: 进程内上限 1536 MiB + 余量 40%(1024 MiB)。为什么必须留这么大(2026-09-20 实测):
    #   进程地板(重启后空闲) ≈830~870 MiB, 跑久后因 jemalloc 滞留页爬到 1.16 GiB;
    #   旧配置上限只有 953 MiB(仅比地板高 ~100 MiB), 一被越过就拒绝一切要内存的查询
    #   —— 表现为"服务活着但干不了活"(连 count() 都拒, SELECT 1 却正常)。
    # 改这里必须同步改 config.d/limits.xml 的 max_server_memory_usage(成对约束), 并复跑
    # scripts/check-compose-budget.sh —— 它核对不等式、缓存边界是否显式声明、以及文档数字
    mem_limit: 2560m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 对象存储 (第 2 阶段湖仓底座, 第 1 阶段先就位) ----------
  minio:
    # 仓库换成 quay.io(2026-09-20, CI 实测): Docker Hub 的 minio/minio 已**拒绝匿名拉取**
    # ("pull access denied ... repository does not exist or may require 'docker login'") ——
    # 本机因为有镜像加速器/本地缓存所以没暴露, 但 GitHub runner 上 `docker compose up` 当场失败。
    # quay.io/minio/minio 是同一镜像(digest 一致: sha256:14cea493...), 可匿名拉取。
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: ov-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9000"     # S3 API (宿主端口 9001, 避免与 ClickHouse native 冲突)
      - "127.0.0.1:9002:9001"     # 控制台
    environment:
      MINIO_ROOT_USER: ov_minio
      MINIO_ROOT_PASSWORD: ov_minio_2026
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # 192m: 实测用量 ~90 MiB(2026-09-20) 且第 1 阶段尚未入链路, 从 320m 收到 192m
    mem_limit: 192m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 关系库 (第 1 阶段第 4 步 Java 微服务 ×5 的底座, 2026-09-18 第九轮补齐) ----------
  # 为什么现在就要: 第 4 步的车辆档案/电池资产/故障码/告警规则/指标查询五个服务全部依赖
  # MySQL + Redis 缓存; 等到那一步再补, 会把"环境不通"和"服务有 bug"两件事混在一起排查。
  # 只建库不建表: 业务 DDL 归各服务(MyBatis Plus), 在这里造表是空转。
  mysql:
    image: mysql:8.4
    container_name: ov-mysql
    restart: unless-stopped
    ports:
      # 宿主 3306 常被本机/公司已有 MySQL 占用, 故用 13306(同 EMQX 1883→11883 的避让口径)
      - "127.0.0.1:${MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ov_root_2026}
      MYSQL_DATABASE: oceanverse
      MYSQL_USER: ov_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ov_app_2026}
      TZ: Asia/Shanghai
      # 本机是 6 GB 共享 VM, 第 1 阶段 MySQL 只建库不建表、零业务负载:
      # 把默认 128m 缓冲池与 performance_schema 开销压下来, 给整机留余量(第 4 步起量后再调大)
      MYSQL_INITDB_SKIP_TZINFO: "1"
    command:
      - --innodb-buffer-pool-size=64M
      - --performance-schema=OFF
      - --max-connections=64

    healthcheck:
      # $$ 是 compose 的转义: 让 $$MYSQL_ROOT_PASSWORD 在**容器内**展开而非由 compose 展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 512m: 第 1 阶段只建库不建表、零业务负载(实测 ~240 MiB, 2026-09-20); 第 4 步 Java 服务起量后按实测上调
    # (innodb 缓冲池已在 command 里显式压到 64M, performance_schema 关闭)
    mem_limit: 512m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 缓存 (第 1 阶段 Java 服务缓存; 第 2 阶段"限流器 Redis 化"的落点) ----------
  redis:
    image: redis:7-alpine
    container_name: ov-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    # maxmemory 必须显式设: Redis 默认无上限, 缓存写满会把整机吃穿 ——
    # 本机 Rancher VM 只有 6GB 且空载已占 84%(见文件头 ③), 项目已因内存整机崩过一次。
    # allkeys-lru: 缓存语义, 淘汰旧键而非拒绝写入。appendonly 关: 限流/缓存数据本就易失。
    # maxmemory 可用 REDIS_MAXMEMORY 覆盖, 但**必须显著小于 mem_limit**:
    # mem_limit 是 cgroup 硬杀线, maxmemory 是 Redis 自己的淘汰线 —— 两者相等时
    # 一旦算上进程自身开销就会触发 OOM kill(表现为容器反复重启)。
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-192mb}
      --maxmemory-policy allkeys-lru
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # 256m: 必须同时满足"明显高于 maxmemory(192mb)"与门禁的成对约束(192 = 256×75%, 正好贴线);
    # 实测用量仅 ~10 MiB(2026-09-20), 故从 320m 收到 256m
    mem_limit: 256m
    logging: *default-logging
    networks: [ov-net]

  # ---------- MQTT Broker (车端长连接接入, 规则引擎转发到网关) ----------
  emqx:
    image: emqx/emqx:5.8.8
    container_name: ov-emqx
    restart: unless-stopped
    ports:
      - "127.0.0.1:${EMQX_MQTT_PORT:-1883}:1883"     # MQTT TCP(宿主端口可覆盖: 本机 1883 被 RabbitMQ MQTT 插件等占用时 EMQX_MQTT_PORT=11883)
      - "127.0.0.1:8883:8883"     # MQTT TLS (生产启用)
      - "127.0.0.1:8083:8083"     # MQTT WebSocket
      - "127.0.0.1:18083:18083"   # Dashboard (admin/public, 登录后立即改密)
    volumes:
      - emqx_data:/opt/emqx/data
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/certs:/opt/emqx/etc/certs:ro
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      # 节点名必须**显式固定**: 镜像 entrypoint 在未设置 NodeName 时会按容器 IP 拼
      # $EMQX_NAME@$LOCAL_IP, 且 EMQX_NODE_NAME 优先级**高于** emqx.conf 的 node.name。
      # 后果: 容器换 IP 就换 mnesia 目录 → seed-users.sh 灌的"一车一密"静默失效
      # (2026-09-18 审计实测: security-check ①④ 失败, 卷内堆积三代孤儿目录)。
      EMQX_NODE__NAME: emqx@127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:18083/status"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 384m: 实测用量 ~227 MiB(2026-09-20), 从 512m 收到 384m(仍留 ~70% 余量应对连接/会话峰值)
    mem_limit: 384m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 指标采集 (网关 /metrics → Prometheus → Grafana, 设计文档 §9) ----------
  prometheus:
    # 同 grafana: 不钉小版本号(国内镜像站常缺 tag), 见 README §6 修订记录
    image: prom/prometheus:latest
    container_name: ov-prometheus
    restart: unless-stopped
    # --web.enable-lifecycle(2026-09-20 补): 允许 POST /-/reload 热载配置与**规则文件**。
    # 为什么必须开: 规则/抓取配置都是 bind mount, 改完**文件立刻是新的**, 但 Prometheus 只在
    # 启动时读它 —— 实测出现过"文件里 10 条规则、进程里 8 条", 容器 healthy、面板照常出图,
    # 新告警整条不生效(第 1、2 步评审发现)。开了之后: 改规则 → curl -X POST localhost:9090/-/reload。
    # 注意: 该端点**无鉴权**, 因此本服务端口已绑 127.0.0.1(见下方 ports), 不要改回全网卡。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"     # Web UI / API
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    # 256m: 2 个 target × 5s 抓取 + 10 条规则, 实测用量约 65 MiB(2026-09-20), 从 384m 收到 256m
    mem_limit: 256m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 可视化看板 ----------
  grafana:
    # 注意: 不要钉具体小版本号(如 12.2.0), 国内镜像站经常缺特定 tag; latest 实测可拉取
    image: grafana/grafana-oss:latest
    container_name: ov-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 预装 ClickHouse 数据源插件
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 320m: 2 个 provisioning 面板 + 2 个数据源, 实测用量约 238 MiB(2026-09-20) 且渲染时有尖峰,
    # 故只从 384m 小幅收到 320m(比其余组件留更多余量)
    mem_limit: 320m
    logging: *default-logging
    networks: [ov-net]

  # ---------- 实时计算 (第 1 阶段第 3 步: Flink SQL 三个作业) ----------
  # 形态: **session cluster**(1 JM + 1 TM), 作业用 sql-client 提交 —— 3 个小作业反复重提交的调试场景,
  #   application mode 会让每个作业独占一套 JM/TM(compose 里多出 5+ 个 Flink 容器), 超出本阶段需要。
  # 挂 profile 而非默认启动: 基础栈仍是"八容器"(文档与 CI 的口径不变), 起 Flink 用
  #   `docker compose --profile realtime up -d`。第 3 步作业全部落地后是否提升为默认栈, 那时再定。
  flink-jobmanager:
    profiles: ["realtime"]
    # 镜像自建原因: 官方镜像 /opt/flink/lib **不含任何连接器**(实测), 三个 jar 由
    # deploy/flink/Dockerfile 补入, 版本与 Flink minor 强绑定(3.4.0-1.20 ↔ 1.20.x)
    build:
      context: ./flink
    image: oceanverse/flink:1.20.5
    container_name: ov-flink-jm
    # 角色参数**必须显式给**: 官方入口 docker-entrypoint.sh 不带默认角色, 缺了它只打印 usage
    # 然后 exit 0 —— 症状是容器 restarting 循环、日志里反复出现 Usage 行(2026-09-20 实测踩到)
    command: jobmanager
    restart: unless-stopped
    ports:
      # 宿主端口用 18088 而不是 8081: 本机(公司环境)已有 Java 服务占着 IPv6 `*:8081`,
      # 而 macOS 上 `localhost` 优先解析成 `::1` → 打 localhost:8081 会命中那个 Java 服务
      # 而不是 Flink(2026-09-20 实测; 与 CI 上"localhost 解析成 ::1"是同一类坑)。
      # 访问一律用 http://127.0.0.1:18088 —— 本仓 180xx 段的避让口径与网关 18080 一致
      - "127.0.0.1:18088:8081"   # Flink UI / REST(回环绑定)
    environment:
      # 启用镜像**自带**的 s3 插件(opt/ → lib/, 无需下载): 检查点落 MinIO 靠它
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-1.20.5.jar
      # ⚠ 这个多行变量里**只能写 `key: value`**, 说明一律写在外面 —— 官方入口
      #   (docker-entrypoint.sh → prepare_configuration)把它当 YAML 解析后合并进容器内的
      #   conf/config.yaml, **注释行同样会被当成配置键**: 实测 12 条注释全变成了怪键
      #   (如 '#有checkpoint才谈得上failover'), 且行内空格被吞掉(scripts/check-docs.sh ⑩ 已加门禁)。
      #
      # 另: 下面是**集群侧默认值**。作业级配置(检查点/重启策略/S3 客户端)的**唯一生效来源是
      #   提交端** —— SQL Client 不会把远端集群的作业级配置注入 JobGraph(实测: 集群侧
      #   interval=60s 而作业跑满 3 分钟检查点为 0 次)。提交端在
      #   lakehouse/warehouse/streaming/submit-jobs.sh 的 CLIENT_FLINK_PROPERTIES, 两边同名键
      #   由 scripts/check-docs.sh ⑩ 强制一致。
      # 进程 448m = 堆 ~192m + metaspace 128m + JVM overhead 128m（显式压小 metaspace,
      # 否则默认 256m 会把 448m 的进程吃掉一半, 见 Dockerfile/README 的内存说明）
      # ---- 检查点(2026-09-20 起): 状态落 MinIO ----
      # 键名用 `execution.checkpointing.*` —— 旧的 `state.checkpoints.dir` 在 1.20 会打弃用告警(实测)
      # 有 checkpoint 才谈得上 failover: 默认 restart-strategy=none 时任何瞬时故障(如 broker 抖动)
      # 都会让作业**永久 FAILED**, 检查点则永远用不上。有限次重启 + 从最近检查点恢复才闭环
      # S3 客户端(镜像自带 flink-s3-fs-hadoop, 由 ENABLE_BUILT_IN_PLUGINS 启用; 无需下载)
      # Prometheus 指标暴露(容器网内 :9249, 不发布到宿主 —— 与"回环绑定"纪律一致):
      # 没有它, 作业静默死掉在监控上没有任何信号(2026-09-20 评估发现的缺口)
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 448m
        jobmanager.memory.jvm-metaspace.size: 128m
        jobmanager.memory.jvm-overhead.min: 128m
        execution.checkpointing.dir: s3://oceanverse-flink/checkpoints
        execution.checkpointing.savepoint-dir: s3://oceanverse-flink/savepoints
        execution.checkpointing.interval: 60s
        execution.checkpointing.min-pause: 30s
        execution.checkpointing.timeout: 5min
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ov_minio
        s3.secret-key: ov_minio_2026
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      # 判据刻意取"JM 能看到 TM": 这条同时证明了两件事(自身已就绪 + TM 已注册), 比只看端口强
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview | grep -qE '\"taskmanagers\":[1-9]'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 512m: 进程上限 448m + 余量；与 TM 合计 1536 MiB = 第 3 步预留额度
    mem_limit: 512m
    logging: *default-logging
    networks: [ov-net]

  flink-taskmanager:
    profiles: ["realtime"]
    image: oceanverse/flink:1.20.5   # 复用 JM 构建的同名镜像(同一 context, 不重复构建)
    container_name: ov-flink-tm
    command: taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    environment:
      ENABLE_BUILT_IN_PLUGINS: flink-s3-fs-hadoop-1.20.5.jar
      # 3 个 slot ↔ Kafka vehicle-report-raw 的 3 个分区(实测 3), 并行度不浪费
      # 检查点: **TM 是真正把状态写到 s3:// 的一方**, 所以 s3.* 客户端配置必须在这里也给全 ——
      #   只给 JM 的话 TM 会拿默认 endpoint 去连 AWS 真 S3(2026-09-20 查配置时发现的缺口)。
      # 作业级的 restart-strategy/检查点周期不在这里: 它们只对提交端生效(见 JM 处说明)
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 3
        taskmanager.memory.process.size: 896m
        taskmanager.memory.jvm-metaspace.size: 128m
        taskmanager.memory.jvm-overhead.min: 128m
        taskmanager.memory.managed.size: 128m
        taskmanager.memory.network.min: 64m
        execution.checkpointing.dir: s3://oceanverse-flink/checkpoints
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        s3.access-key: ov_minio
        s3.secret-key: ov_minio_2026
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      # TM 没有 HTTP 端点, 故直接判"JVM 进程在不在"(不依赖 ps/netstat 是否装)
      test: ["CMD-SHELL", "grep -qa TaskManagerRunner /proc/[0-9]*/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # 1024m: 进程上限 896m + 余量
    mem_limit: 1024m
    logging: *default-logging
    networks: [ov-net]

volumes:
  kafka_data:
  clickhouse_data:
  minio_data:
  grafana_data:
  emqx_data:
  prometheus_data:
  mysql_data:
  flink_checkpoints:
  # redis 无卷: appendonly 关闭(纯缓存语义), 重启即空是预期行为

networks:
  ov-net:
    driver: bridge
