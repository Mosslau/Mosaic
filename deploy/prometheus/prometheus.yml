# OceanVerse 第 1 阶段 Prometheus 抓取配置
# 注意: 网关跑在宿主机(go run / 二进制), 容器经 host.docker.internal 访问——
# 与 emqx.conf webhook 同一主机名(排障见 deploy/README Q8)。
global:
  scrape_interval: 5s   # 压测/故障演练要看清瞬时曲线, 第 1 阶段本机资源充裕
  evaluation_interval: 15s

scrape_configs:
  # 网关: 请求速率/延迟/拒绝率/在途(门面指标)
  - job_name: device-gateway
    metrics_path: /metrics
    static_configs:
      # 本机 8080~8083 被公司 Java 服务占用, 开发期网关跑 18080(GATEWAY_PORT=18080)
      # 与 emqx.conf webhook url 同端口(§5.3 对齐线); 若 8080 腾出可整体改回
      - targets: ["host.docker.internal:18080"]
        labels:
          service: device-gateway

  # 编解码服务: 消费/解码/DLQ/lag/flush(管道指标)
  # 同为宿主机进程, 端口见 CODEC_METRICS_PORT(默认 18090); 指标口径见《接入层设计》§9
  - job_name: device-codec
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:18090"]
        labels:
          service: device-codec
