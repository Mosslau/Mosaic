## =====================================================================
## OceanVerse EMQX 配置 (EMQX 5.8, HOCON 格式)
## 职责: MQTT 协议终结 + 设备连接管理 + 规则引擎转发
## 治理职责(鉴权契约/校验/Kafka 写入)在 Go 网关, 不在此
## 挂载: deploy/emqx/emqx.conf → /opt/emqx/etc/emqx.conf
## =====================================================================

node {
  name = "emqx@127.0.0.1"
  cookie = "oceanverse-emqx-cookie-change-in-prod"
  data_dir = "/opt/emqx/data"
}

cluster {
  name = oceanverse
  ## 本地单节点; 生产集群改 static + seeds 列表(见 README 集群章节)
  discovery_strategy = singleton
}

log.console.level = warning

## ---------- 监听器 ----------
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000          ## 单节点百万连接上限(EMQX 能力基线)
  ## 单设备消息速率限制: 第一道限流在协议层完成
  ## rate_limit = "1000/s"          ## 生产按需开启
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
}

## 镜像默认的 wss(8084)期望 etc/certs/*.pem, 被我们挂载的 certs/ 目录顶掉 → 显式关闭
listeners.wss.default { enable = false }

## TLS 监听器(公网路径, 设计文档 §8.2 三件套之一)
## 证书由 deploy/emqx/gen-certs.sh 生成本地自签(生产换正式 CA)
listeners.ssl.default {
  bind = "0.0.0.0:8883"
  ssl_options {
    certfile  = "/opt/emqx/etc/certs/server.crt"
    keyfile   = "/opt/emqx/etc/certs/server.key"
    cacertfile = "/opt/emqx/etc/certs/ca.crt"   ## 供未来 mTLS(双向)启用
  }
  ## 一车一密(三件套之二): 公网路径(8883)独占设备认证, 1883 内网保持匿名
  ## EMQX 5.8 支持监听器级认证; 用户名=clientid=VIN, 每车独立密码
  authentication = [
    {
      mechanism = password_based
      backend = built_in_database
      user_id_type = username
      password_hash_algorithm { name = sha256, salt_position = suffix }
    }
  ]
}

## ACL(三件套之三, 全局): 规则在 deploy/emqx/acl.conf
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [ { type = file, enable = true, path = "/opt/emqx/etc/acl.conf" } ]
}

## ---------- 认证/授权 ----------
## 本地模拟: 未配置认证链 = 匿名放行(仅开发!)
## 生产加固三件套(README 生产清单):
##   ① authentication: password_based + built_in_database(或对接车辆档案服务 HTTP 认证)
##   ② authorization: ACL(设备只能 pub 自己的 topic: ov/${clientid}/#)
##   ③ TLS 8883 替代 1883

dashboard {
  listeners.http { bind = "0.0.0.0:18083" }
}

## =====================================================================
## 规则引擎: MQTT 消息 → Webhook → Go 网关 /api/v1/mqtt/ingest
## Topic 契约: ov/{vin}/status | ov/{vin}/battery | ov/{vin}/fault
## =====================================================================

## Webhook 桥(连接池 + 异步缓冲 + 失败重试)
bridges.webhook.device_gateway {
  enable = true
  connect_timeout = "5s"
  request_timeout = "15s"
  pool_size = 16                     ## 到网关的 HTTP 连接池
  pool_type = "hash"                 ## 按 clientid 哈希到连接, 同车消息保序
  url = "http://host.docker.internal:18080/api/v1/mqtt/ingest"
  ## 端口说明: 本机 8080~8083 被公司 Java 服务占用, 网关开发期跑 18080(GATEWAY_PORT=18080)
  ## 备选地址(不同容器运行时): host.lima.internal / 宿主机局域网 IP
  method = "post"
  headers {
    "content-type" = "application/json"
    "x-webhook-token" = "dev-webhook-secret"   ## 与网关 GATEWAY_WEBHOOK_TOKEN 一致
  }
  ## 消息体模板: ${payload} 原样嵌入设备上报的 JSON
  body = "{\"clientid\":\"${clientid}\",\"topic\":\"${topic}\",\"qos\":${qos},\"ts\":${timestamp},\"payload\":${payload}}"
  ## 资源层: 异步发送 + 缓冲, EMQX→网关短暂断连时消息进缓冲重试
  ## 注意(2026-09-16 故障演练实测修正):
  ##   ① 5.8 开源版缓冲是内存态(buffer_mode 仅 memory_only/volatile_offload), 无磁盘缓冲;
  ##      EMQX 自身宕机时缓冲丢失——该场景损失边界在设备端(与演练③一致)
  ##   ② request_ttl 必须 > 检出断连时间 + 网关重启时间, 否则恢复前缓冲即过期丢弃
  ##      (实测: ttl=60s 时 45s 停机窗口丢 ~5100 条; 300s 可覆盖典型重启+排空余量)
  resource_opts {
    worker_pool_size = 4
    max_buffer_bytes = "256MB"
    query_mode = "async"
    request_ttl = "300s"
    health_check_interval = "5s"   ## 默认 15s; 调小以更快检出网关恢复, 减少 TTL 内损耗
  }
}

## 规则: 车端三类 topic 全部走 webhook
rule_engine.rules.ov_vehicle_ingress {
  sql = "SELECT * FROM \"ov/+/status\", \"ov/+/battery\", \"ov/+/fault\""
  actions = ["webhook:device_gateway"]
  enable = true
  description = "OceanVerse 车端 MQTT 消息 → Go 接入网关"
}

## =====================================================================
## 二进制通道(映射文档 §7, MQTT 载荷先行): ov/{vin}/bin → 网关透传 /api/v1/bin/ingest
## 载荷为 GB/T 32960 二进制帧, 规则 SQL 用 base64_encode 转成可进 JSON 的形态;
## 网关不解帧, 套信封进 Kafka ov.raw.binary.v1, 解码归 device-codec
## =====================================================================

bridges.webhook.device_gateway_bin {
  enable = true
  connect_timeout = "5s"
  request_timeout = "15s"
  pool_size = 16
  pool_type = "hash"
  url = "http://host.docker.internal:18080/api/v1/bin/ingest"
  method = "post"
  headers {
    "content-type" = "application/json"
    "x-webhook-token" = "dev-webhook-secret"   ## 与网关 GATEWAY_WEBHOOK_TOKEN 一致
  }
  body = "{\"clientid\":\"${clientid}\",\"topic\":\"${topic}\",\"ts\":${timestamp},\"payload_b64\":\"${payload_b64}\"}"
  resource_opts {
    worker_pool_size = 4
    max_buffer_bytes = "256MB"
    query_mode = "async"
    request_ttl = "300s"              ## 同主桥: 覆盖网关宕机检出+重启窗口(故障演练 P1 修复口径)
    health_check_interval = "5s"
  }
}

rule_engine.rules.ov_binary_ingress {
  sql = "SELECT clientid, topic, timestamp, base64_encode(payload) AS payload_b64 FROM \"ov/+/bin\""
  actions = ["webhook:device_gateway_bin"]
  enable = true
  description = "OceanVerse 车端二进制帧(GB/T 32960) → Go 网关透传 → ov.raw.binary.v1"
}
