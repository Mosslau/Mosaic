%% OceanVerse EMQX ACL(设计文档 §8.2: 设备只能 pub 自己的 topic, 防伪造他人数据)
%% 规则按顺序匹配, 首条命中即生效; 未命中走 no_match=deny(emqx.conf)。

%% 生产形态(8883, TLS+一车一密): clientid=VIN, 只能发布 ov/{自己的VIN}/#
{allow, all, publish, ["ov/${clientid}/#"]}.

%% dev 形态(1883 内网匿名联调): clientid=dev-*, 放行 ov/#
{allow, {clientid, {re, "^dev-"}}, publish, ["ov/#"]}.
