name: CI

# 最小 CI（2026-09-18 落地）：挡住三类曾真实发生的回归
#   ① 代码回归      —— 四模块 gofmt / build / vet / test / test -race（矩阵）
#   ② 镜像断裂      —— 契约拆分曾导致 Dockerfile 静默构建失败（replace 目标在上下文外）
#   ③ 文档漂移      —— 旧路径/裸引用/数字对不上/围栏嵌套（scripts/check-docs.sh）
#   ④ 编排断裂      —— compose 不可解析 / 镜像能构建但跑不起来（2026-09-18 补）
#
# 触发: push 到 main + 所有 PR；并发同分支时取消旧跑（省 runner）
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 锁定工具链: 版本由各模块 go.mod 的 go 指令决定, 不自动下载其它 toolchain
  GOTOOLCHAIN: local

jobs:
  # ---------- 四模块编译 + 静态检查 + 单测 ----------
  go:
    name: go (${{ matrix.module }})
    # 显式钉 LTS: ubuntu-latest 将于 2026-10-19 迁往 Ubuntu 26, 钉住避免环境突变
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module:
          - ingest/device-contracts
          - ingest/device-gateway
          - ingest/device-codec
          - ingest/device-simulator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 用各模块 go.mod 里的 go 指令(1.25); Go 版本升级时无需改本文件
          go-version-file: ${{ matrix.module }}/go.mod
          # 缓存键基于 go.mod —— device-contracts 无 go.sum, 指向 go.sum 会报 "paths were not resolved"
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: gofmt
        working-directory: ${{ matrix.module }}
        # 格式门禁: 此前无此检查, 实测有 7 个文件长期未格式化而 CI 全绿
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未 gofmt, 请执行 gofmt -w:"; echo "$unformatted"; exit 1
          fi
      - name: build
        working-directory: ${{ matrix.module }}
        run: go build ./...
      - name: vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: test
        working-directory: ${{ matrix.module }}
        run: go test ./... -count=1 -cover
      - name: test (race)
        working-directory: ${{ matrix.module }}
        # 竞态门禁: 此前无人跑 -race, codec 主循环的共享计数器竞态因此长期潜伏
        run: go test -race ./... -count=1

  # ---------- 镜像可构建（根上下文, 契约模块在 replace 路径上） ----------
  docker:
    name: docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: build device-gateway image
        run: docker build -f ingest/device-gateway/Dockerfile -t oceanverse/device-gateway:ci .
      - name: build device-codec image
        run: docker build -f ingest/device-codec/Dockerfile -t oceanverse/device-codec:ci .
      # Flink 镜像自建(官方镜像不含任何连接器, 见 deploy/flink/Dockerfile)。
      # 这里只验"能构建 + 三个 jar 真在 lib 里" —— 构建期要拉 Maven, 版本写错不会报错,
      # 只会在作业提交时炸(NoSuchMethodError), 所以把"jar 在位"也断言掉。
      - name: build flink image
        run: |
          docker build -f deploy/flink/Dockerfile -t oceanverse/flink:ci deploy/flink
          docker run --rm --entrypoint sh oceanverse/flink:ci -c 'ls /opt/flink/lib | grep -q flink-sql-connector-kafka'
          # 只断言 kafka 连接器: ClickHouse sink 走 Kafka 结果 topic + CH Kafka 引擎(见 Dockerfile 头注)
          # 注意 jar 名是 flink-**sql**-connector-kafka —— 第一版断言写成 flink-connector-kafka, 少了 sql-,
          # 于是构建成功却断言失败(CI 抓到的; 这类"判据字符串写错"只有真跑才暴露)
          docker run --rm --entrypoint sh oceanverse/flink:ci -c 'ls /opt/flink/lib | grep -q flink-sql-connector-kafka'
      - name: smoke run (gateway health)
        run: |
          docker run -d --name gw-smoke -p 18080:18080 -p 18081:18081 \
            -e GATEWAY_PORT=18080 -e GATEWAY_DEV_MODE=true \
            -e KAFKA_BROKERS=127.0.0.1:19092 \
            oceanverse/device-gateway:ci
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:18080/health; then ok=1; break; fi
            sleep 1
          done
          docker logs gw-smoke | tail -5
          test "${ok:-0}" = "1"
          # 真业务路径冒烟: /health 恒返回 up(handler/report.go), 鉴别力太低 ——
          # 契约校验失败期望 400, 证明 handler 链真的接上了。
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:18080/api/v1/vehicle/report \
            -H 'X-Device-Token: dev-OV00000001' -H 'Content-Type: application/json' -d '{"vin":"OV00000001"}')
          test "$code" = "400" || { echo "契约校验应 400, 实际 $code"; docker logs gw-smoke | tail -5; exit 1; }
          # 指标端点必须独立于业务端口(2026-09-18 整改): 业务端口不再暴露 /metrics
          # 注意: 用 Gauge 断言而非 CounterVec —— 后者在首个 series 出现前**不导出**,
          # 新容器里 grep gateway_requests_total 会失败(端点其实是 200)。
          curl -sf http://localhost:18081/metrics | grep -q gateway_inflight_requests
          if curl -sf http://localhost:18080/metrics >/dev/null; then
            echo "业务端口不应暴露 /metrics"; docker logs gw-smoke | tail -5; exit 1
          fi
          docker rm -f gw-smoke
      - name: smoke run (codec health + metrics)
        run: |
          # 此前 codec 镜像只 build 不 run, CMD/环境变量/端点接线断了发现不了
          docker run -d --name codec-smoke -p 18090:18090 \
            -e KAFKA_BROKERS=127.0.0.1:19092 \
            oceanverse/device-codec:ci
          for _ in $(seq 1 20); do
            if curl -sf http://localhost:18090/health; then ok=1; break; fi
            sleep 1
          done
          docker logs codec-smoke | tail -5
          test "${ok:-0}" = "1"
          curl -sf http://localhost:18090/metrics | grep -q codec_consumed_total
          docker rm -f codec-smoke

  # ---------- 链路健康自检（含 Q11 僵尸消费组判据；此前只能靠人工发现） ----------
  pipeline-health:
    name: pipeline health (Q11 zombie consumers)
    runs-on: ubuntu-24.04
    services:
      kafka:
        image: apache/kafka:3.9.1
        ports: ["19092:19092"]
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          CLUSTER_ID: ci-health-cluster-01
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s --health-timeout 10s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: build images
        run: |
          docker build -f ingest/device-gateway/Dockerfile -t oceanverse/device-gateway:ci .
          docker build -f ingest/device-codec/Dockerfile -t oceanverse/device-codec:ci .
      - name: start gateway + codec (宿主网络, 模拟本机拓扑)
        run: |
          docker run -d --name gw-health --network host \
            -e GATEWAY_PORT=18080 -e GATEWAY_DEV_MODE=true -e KAFKA_BROKERS=127.0.0.1:19092 \
            oceanverse/device-gateway:ci
          docker run -d --name codec-health --network host \
            -e KAFKA_BROKERS=127.0.0.1:19092 \
            oceanverse/device-codec:ci
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:18080/health >/dev/null && curl -sf http://localhost:18090/health >/dev/null; then break; fi
            sleep 2
          done
          docker logs gw-health | tail -3; docker logs codec-health | tail -3
      - name: install lsof
        # GitHub ubuntu runner 不预装 lsof, 而判据 3(端口/孤儿检测)依赖它。
        # 这一步是必须的: 缺失时旧版脚本会把"工具缺失"伪装成"服务没起来"(实测踩过)。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lsof
      - name: resolve kafka container name
        id: kafka
        # 关键: GitHub Actions 的 service container **名字不是服务键** ——
        # 它形如 <repo>-<hash>-kafka-1, 而 `services` 上下文只暴露**容器 ID**。
        # 第一次跑就是把 KAFKA_CONTAINER 写成 "kafka" 而失败(实测: No such container: kafka)。
        run: |
          echo "id=${{ job.services.kafka.id }}" >> "$GITHUB_OUTPUT"
          docker ps -a --format '{{.ID}}  {{.Names}}  {{.Image}}' | head -5
      - name: health check (Q11 判据 — 成员数/分区归属/端口监听者/计数活性/受理对账)
        env:
          KAFKA_CONTAINER: ${{ steps.kafka.outputs.id }}
          # 不灌探针帧(CI 里没有 EMQX, 注入必然失败): PROBE=0 只做不依赖流量的判据
          PROBE: "0"
        run: bash scripts/check-pipeline-health.sh -w 15
      - name: dump logs on failure
        if: failure()
        run: docker logs gw-health | tail -20; docker logs codec-health | tail -20
      - name: cleanup
        if: always()
        run: docker rm -f gw-health codec-health || true

  # ---------- 八容器编排：可解析 + 真的能起来 + 内存预算 ----------
  # 2026-09-20 补(第 1、2 步评审): 原 compose 作业只做 `config -q`(语法校验), 于是
  #   ① MySQL/Redis 写进 compose 但**从未真正 up 过**(本机实测只起了 6 个容器,
  #      而看板写着"八容器 healthy" —— 结构校验冒充了运行验证);
  #   ② mem_limit 之和超过 VM 物理内存(6.88 GiB > 6.2 GiB)且无人发现。
  # 本作业把两件事都变成 CI 判据: 真起来 + 逐容器 healthcheck 通过 + 预算算术 + 规则新鲜度。
  compose:
    name: docker compose (up + budget)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: compose config
        working-directory: deploy
        run: |
          cp .env.example .env || true
          docker compose config -q
      - name: memory budget gate
        run: bash scripts/check-compose-budget.sh
      # 门禁自己也会退化成"僵尸判据"(实测: 成对约束判据长期打印"跳过"而没人发现),
      # 故把负向对照固化: 在隔离假树里施加 10 种扰动, 每种都必须让门禁变红
      - name: budget gate self-test (negative controls)
        run: bash scripts/test-compose-budget.sh
      - name: compose up (等待全部 healthy)
        working-directory: deploy
        run: |
          # 8883 TLS 需要证书; CI 不走公网路径, 但 emqx.conf 引用了证书文件 → 先生成自签
          bash emqx/gen-certs.sh
          # 拉取加退避重试: 2026-09-20 实测 runner 拉 redis:7-alpine 时
          # "read: connection reset by peer" → 8 个镜像全部 Interrupted、作业直接红。
          # 这是 registry 侧瞬时故障(与本仓配置无关), 但**必须先拉完再 up**, 否则 up 失败在半路。
          for i in 1 2 3 4 5; do
            if docker compose pull --quiet; then break; fi
            echo "pull 失败(第 $i 次), 退避 10s 重试"; sleep 10
            [ "$i" = "5" ] && { echo "5 次拉取均失败"; exit 1; }
          done
          docker compose up -d
          unhealthy=""
          # 八容器逐个等 healthy(最多 90s)
          for i in $(seq 1 30); do
            unhealthy=$(docker compose ps --format '{{.Name}} {{.State}} {{.Health}}' | grep -v 'healthy' || true)
            if [ -z "$unhealthy" ]; then break; fi
            sleep 3
          done
          echo "--- 最终状态 ---"
          docker compose ps
          if [ -n "$unhealthy" ]; then
            echo "以下容器未达 healthy: $unhealthy"
            echo "$unhealthy" | awk '{print $1}' | while read -r c; do
              echo "=== logs: $c ==="; docker logs --tail 30 "$c" 2>&1 || true
            done
            exit 1
          fi
      - name: smoke queries (Kafka / ClickHouse / MySQL / Redis)
        working-directory: deploy
        run: |
          set -e
          docker exec ov-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
          curl -sf http://localhost:8123/ping
          docker exec ov-mysql mysqladmin ping -h 127.0.0.1 -u root -pov_root_2026
          # 只建库不建表: 业务表数必须为 0(DDL 属第 4 步各 Java 服务)
          docker exec ov-mysql mysql -u root -pov_root_2026 -N -e \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='oceanverse';" | grep -qx 0
          docker exec ov-redis redis-cli ping | grep -qx PONG
          docker exec ov-redis redis-cli config get maxmemory | tail -1 | grep -qx 201326592
      - name: flink profile up (真起 session cluster)
        working-directory: deploy
        run: |
          set -e
          # 只 build 不 up 曾让"官方镜像缺连接器、入口缺角色参数"这类问题跑到运行期(本机实测踩过)
          docker compose --profile realtime up -d flink-jobmanager flink-taskmanager
          # 轮询到**判据成立**为止, 而不是"HTTP 200 就断言一次" ——
          # CI 首跑(2026-09-20)就是这么红的: JM 起来十几秒内 /overview 已 200, 但 taskmanagers 仍是 0
          # (TM 尚未注册), 于是断言当场失败。这是"就绪探测太弱"的经典错误,
          # 与本仓 pipeline-health 的教训同源: 存活判据必须取**端到端成立的事实**, 不是"端口应答了"。
          ok=""
          for i in $(seq 1 30); do
            json=$(curl -sf http://127.0.0.1:18088/overview || true)
            if [ -n "$json" ] && echo "$json" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          assert d['taskmanagers']==1, d
          assert d['slots-total']==3, d
          assert d['flink-version'].startswith('1.20'), d
          " 2>/dev/null; then ok=1; break; fi
            sleep 3
          done
          echo "$json"
          if [ "${ok:-0}" != "1" ]; then
            echo "Flink 未在 90s 内达到 taskmanagers=1 & slots=3"
            docker compose --profile realtime logs --tail 40 flink-jobmanager flink-taskmanager
            exit 1
          fi
          echo "  flink ok: $json"
          # 两容器都必须 healthy(健康判据见 compose: JM=能看到 TM, TM=JVM 进程在)
          for i in $(seq 1 20); do
            bad=$(docker compose --profile realtime ps --format '{{.Name}} {{.Health}}' | grep flink | grep -v healthy || true)
            [ -z "$bad" ] && break; sleep 3
          done
          docker compose --profile realtime ps
          test -z "$bad"
      - name: realtime layer (建表 + 提作业 + 断言运行)
        working-directory: deploy
        run: |
          set -e
          # 结果 topic 预创建（topic 一律预创建, 不依赖 broker auto-create —— 设计文档 §11.2 的纪律）
          for t in ov.ads.vehicle_online_1m.v1 ov.ads.fault_count_1m.v1 ov.ads.high_temp_battery_1m.v1; do
            docker exec ov-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
              --create --if-not-exists --topic "$t" --partitions 1 --replication-factor 1 >/dev/null
          done
          # raw topic 用 **3 分区**, 与本地/设计一致（Key=VIN 哈希）。
          # 曾是 1 分区 → CI 就覆盖不到"多分区下水位线被安静分区拖住"这条路径(idle-timeout 那个坑),
          # 也覆盖不到"共用消费组会把分区瓜分掉"的隔离判据。2026-09-20 对齐。
          docker exec ov-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic vehicle-report-raw --partitions 3 --replication-factor 1 >/dev/null
          # ClickHouse 对象（3 目标表 + 3 Kafka 引擎表 + 3 物化视图）
          docker exec -i ov-clickhouse clickhouse-client --user ov_admin --password ov_pass_2026 --multiquery < ../lakehouse/warehouse/streaming/clickhouse/init.sql
          n=$(docker exec ov-clickhouse clickhouse-client --user ov_admin --password ov_pass_2026 \
              --query "SELECT count() FROM system.tables WHERE database='oceanverse'")
          echo "oceanverse 对象数 = $n"; test "$n" = "9"
          # 检查点 bucket（S3 不会自动建桶；桶不存在时检查点会静默失败）
          bash ../scripts/init-minio-bucket.sh
          # 提交三个作业（脚本自带"集群里真出现"的强判据与重复提交守卫）
          bash ../lakehouse/warehouse/streaming/submit-jobs.sh
          # 实时层**端到端**自检: 注入测试数据 → 等窗口关闭 → 断言三张 ADS 表真的有数
          # （此前 CI 只到"作业 RUNNING", SQL 语义/字段类型/时区改坏了也照样全绿）
          bash ../scripts/check-realtime-e2e.sh
          # P1 的核心声明: **重启不丢窗口**（取消 → 停机期间灌数 → 重提 → 数据仍进结果表）。
          # 必须排在 e2e 之后: 它会把水位线推到墙钟前约 2 分钟(未来 ts 心跳), 对并发生产者不友好。
          bash ../scripts/check-realtime-restart.sh
      - name: prometheus rules loaded == file (配置新鲜度)
        working-directory: deploy
        run: |
          set -e
          for i in $(seq 1 20); do curl -sf http://localhost:9090/-/healthy >/dev/null && break; sleep 2; done
          loaded=$(curl -sf http://localhost:9090/api/v1/rules \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['data']['groups'];print(sum(len(g['rules']) for g in d))")
          declared=$(grep -c '^\s*- alert:' prometheus/rules/oceanverse-alerts.yml)
          echo "loaded=$loaded declared=$declared"
          test "$loaded" = "$declared"
          # 规则**语义**单测（该响的响、不该响的不响）。起因: 检查点两条规则在运行态出现假阳性 ——
          # 作业取消后残留 series 让 `increase(...)==0` 继续成立, 告警为"已经不存在的作业"持续 firing;
          # 修法是加"仍被暴露"守卫, 这些场景把它钉住（promtool 在 prometheus 镜像里自带）
          docker exec ov-prometheus promtool test rules /etc/prometheus/rules/tests/flink-checkpoints.test.yml
      - name: dump logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 40
      - name: cleanup
        if: always()
        working-directory: deploy
        run: docker compose down -v || true

  # ---------- 文档事实校验 + Mermaid 渲染 ----------
  docs:
    name: docs (facts + mermaid)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: docs facts check
        run: bash scripts/check-docs.sh
      - name: mermaid render check
        run: bash scripts/check-mermaid.sh
