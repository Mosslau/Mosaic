[pytest]
# 从仓库根执行 `python -m pytest -q` 时的收集范围。
#
# 为什么需要这一份：Python 工程配置在 `algorithms/pyproject.toml`，它的 rootdir 是 `algorithms/`，
# 只负责「在 algorithms/ 下跑」的情形。若仓库根没有任何 pytest 配置，从根执行会退化为**收集全树**，
# 于是撞上语言域里需要 pyo3 / Rust 构建的 `smoke_test.py`（收集期即报错，见
# `languages/studies/rs/ph23-ffi-interop/...`），并且把语言域各阶段的示例测试也一起收进来。
#
# 这里只声明「收集哪些目录」，不放其它配置，避免与 algorithms/pyproject.toml 的职责重叠。
testpaths = algorithms engineering/ai-platform
