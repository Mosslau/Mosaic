[project]
name = "mosaic"
version = "0.1.0"
description = "Mosaic：通用数据平台 + AI 平台数据中心 —— 语言 / 算法 / 工程系统三部分实验与实践仓库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
deep-learning = [
    "torch>=2.4",
]
engineering = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
# 本文件的 rootdir 就是 algorithms/，故这里指向自身即可（收集本目录下的实验测试）。
# 「从仓库根执行」时的收集范围由仓库根的 pytest.ini 负责（只覆盖 algorithms/；
# engineering/ 的子项目自带 pytest 配置，由仓库根 verify.sh 分域调用）。
testpaths = ["."]
addopts = ["--import-mode=importlib"]
