# ph12 示例 6 —— Docker Compose：单命令起服务
# 演示点（对应主文档 3.4 节）：
#  - 服务声明 + 构建上下文
#  - 端口映射（host:container）
#  - 环境变量注入（12-Factor：配置不进镜像）
#  - restart 策略（容器退出自动重启）
#  - depends_on + 健康探针写法（真实项目用 K8s probe，见 project/deploy/k8s）
# 用法：docker compose up --build；Ctrl+C 停止
# 验证状态：本机 docker daemon 可用时实测（记录见 examples/README.md）
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: ph12-ex06:latest
    ports:
      - "58006:58006"            # 宿主 58006 -> 容器 58006（容器内监听 :58006）
    environment:
      PORT: "58006"              # 12-Factor：配置走环境变量，镜像不携带环境信息
      LOG_LEVEL: "info"
    # 探针说明：scratch 镜像无 shell/wget/curl，Compose healthcheck 需要镜像内带探针工具；
    # 生产标准做法是把探针写进 K8s 清单（livenessProbe/readinessProbe，见
    # project/deploy/k8s/deployment.yaml），由 kubelet 执行 HTTP 探活——本文件演示
    # 端口/环境变量/restart 编排，探针的完整落地在 project/ 与主文档 3.5 节。
    restart: unless-stopped
