# ph12 阶段项目 —— Secret（演示值）
# 说明：Deployment 的 DB_URL 从这里注入（secretKeyRef，见 deployment.yaml）。
# 本文件是**演示占位**（明文 base64 仅是教学展示"Secret 的形态"）：
# 生产环境用外部 Secret 管理（sealed-secrets / External Secrets Operator / 云厂商 KMS），
# 绝不把真实凭据明文写进仓库。先 kubectl apply -f deploy/k8s/ 再 apply Deployment，
# 顺序无关（kubectl 一并应用，Deployment 引用的 Secret 存在即可）。
apiVersion: v1
kind: Secret
metadata:
  name: ph12-api-secret
type: Opaque
data:
  # 演示值：postgres://user:pw@db:5432/app（base64 编码；生产替换为真实凭据）
  db-url: cG9zdGdyZXM6Ly91c2VyOnB3QGRiOjU0MzIvYXBw
