# examples/ex04-nginx/nginx.conf —— Nginx 反向代理：TLS/静态/限流的门卫，转发给 uvicorn
# 验证环境目标：Nginx 1.24+（本机 Homebrew nginx 1.31.2）
# 验证状态：语法已验证（本机实测 `nginx -t -c <本文件>` 通过；注意 `include mime.types`
#   按配置文件所在目录解析，本机验证时临时从 /opt/homebrew/etc/nginx/ 拷贝了一份到本目录，
#   生产上 nginx 包自带的 conf 目录里已有）；未起真实反代链路
#   （生产形态里 upstream 指向容器/内网服务，本机只做了配置级验证）
# 语法检查：nginx -t -c /path/to/nginx.conf
# 说明：这是「完整独立配置」（含 events/http 块）；在生产服务器上通常只写 sites-available/
#   或 conf.d/ 里的 server 段，主配置已存在。

worker_processes auto;
pid /tmp/ex04-nginx.pid;               # 演示用；生产默认 /run/nginx.pid
error_log /tmp/ex04-nginx-error.log warn;  # 演示用；生产默认 /var/log/nginx/error.log

events {
    worker_connections 1024;           # 单 worker 最大并发连接
}

http {
    include mime.types;                # 相对 nginx prefix 的 conf 目录
    default_type application/octet-stream;
    access_log /tmp/ex04-nginx-access.log;  # 演示用；容器镜像里改 /dev/stdout

    # upstream：后端实例池。这里 3 条表示「反代到 3 个 uvicorn worker 进程/容器」，
    # Nginx 默认轮询（round-robin）；一台挂掉自动摘除（max_fails/fail_timeout）
    upstream bhealth_api {
        server 127.0.0.1:8000 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8001 max_fails=2 fail_timeout=10s;
        server 127.0.0.1:8002 max_fails=2 fail_timeout=10s;
        keepalive 32;                  # 到后端的长连接池，省去每个请求都握手
    }

    server {
        listen 8080;

        # 静态资源 Nginx 直接发，不占用 Python worker（Nginx 发静态文件比 Python 快得多）
        location /static/ {
            alias /opt/bhealth-api/static/;
            expires 7d;                # 浏览器缓存一周
        }

        # 其余全部反代给后端池
        location / {
            proxy_pass http://bhealth_api;
            # 把客户端真实信息透传给后端（后端日志/限流依赖这些头）
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
