# examples/feat-demo/Cargo.toml —— 示例 4：features 特性开关（default/json/pretty）
# 来源：languages/rs/ph06-cargo-module/06-cargo-module.md 第 6 章示例 4
# 验证环境：rustc 1.92.0 + cargo 1.92.0，依赖 serde_json 1.0.108（可选，需网络拉取）
# 编译：cargo build；运行：cargo run [--no-default-features|--features pretty|--all-features]；测试：cargo test
# 验证状态：已验证（rustc 1.92.0）
[package]
name = "feat-demo"
version = "0.1.0"
edition = "2021"

[features]
default = ["json"]
json = ["dep:serde_json"]  # 可选依赖重命名为 json 特性
pretty = []                # 纯开关

[dependencies]
serde_json = { version = "1.0.108", optional = true }
