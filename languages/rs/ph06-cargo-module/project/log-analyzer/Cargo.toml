# 根 Cargo.toml —— 虚拟清单：多模块日志分析工具 workspace
# 来源：languages/rs/ph06-cargo-module/project/log-analyzer（阶段项目源码）
# 验证环境：rustc 1.92.0 + cargo 1.92.0，纯标准库
# 编译：cargo build --workspace（在本目录执行）
# 运行：cargo run -p log-cli [日志文件路径]
# 测试：cargo test --workspace
# 验证状态：已验证（rustc 1.92.0）

[workspace]
resolver = "2"
members = ["crates/log-parser", "crates/log-aggregator", "crates/log-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
