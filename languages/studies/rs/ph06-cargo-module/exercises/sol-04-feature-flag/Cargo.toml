# exercises/sol-04-feature-flag/Cargo.toml —— 练习 4 参考实现：features 可选能力（text/json）
# 验证环境：rustc 1.92.0 + cargo 1.92.0，依赖 serde_json 1.0.108（可选，需网络拉取）
# 编译：cargo build；运行：cargo run [--no-default-features|--features json|--all-features]；测试：cargo test
# 验证状态：已验证（rustc 1.92.0）
[package]
name = "fmt-out"
version = "0.1.0"
edition = "2021"

[features]
default = ["text"]
text = []                  # 纯开关
json = ["dep:serde_json"]  # 可选依赖重命名为 json 特性

[dependencies]
serde_json = { version = "1.0.108", optional = true }
