# examples/json-cfg/Cargo.toml —— 示例 3：添加第三方 crate 并固定版本（serde_json =1.0.108 精确锁定）
# 来源：languages/rs/ph06-cargo-module/06-cargo-module.md 第 6 章示例 3
# 验证环境：rustc 1.92.0 + cargo 1.92.0，依赖 serde 1.0.197 / serde_json =1.0.108（需网络拉取）
# 编译：cargo build；运行：cargo run；测试：cargo test（在本目录执行）
# 验证状态：已验证（rustc 1.92.0）
[package]
name = "json-cfg"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "=1.0.108"  # "=" 精确锁定：manifest 层面也不允许升级
