#
# 验证环境：rustc/cargo 1.92.0（macOS arm64，rustup 管理）；第三方依赖版本见 dev-dependencies 与 Cargo.lock。
# 验证状态：已验证（本机 cargo test / cargo bench 全绿；cargo fmt --check 干净、clippy --all-targets -- -D warnings 零告警）。
[package]
name = "sol-04-criterion-compare"
version = "0.1.0"
edition = "2021"
publish = false

# exercises/练习 4 参考实现：用 criterion 对比「优化前 vs 优化后」两条解析路径。
# - 优化前 v1_naive_snapshot：把整段日志解析成「每条拥有数据」的 Vec（每字段一次分配）；
# - 优化后 v2_zero_copy_stream：records 借用流式迭代，零分配。
# 对比口径：同一份日志、同一组尺寸扫描，读 throughput 与耗时（benches/replay_compare.rs）。
# 基线/回归演练（在项目目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench --bench replay_compare \
#       -- --save-baseline before
#   修改代码或换 impl 后：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench --bench replay_compare \
#       -- --baseline before
#   （看 change 输出：criterion 用 bootstrap + t 检验给出变化区间与 p 值，见主文档 4.3）
# 质量闸门：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo clippy --all-targets -- -D warnings

[dependencies]
record-parser = { path = "../record-parser" }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "replay_compare"
harness = false
