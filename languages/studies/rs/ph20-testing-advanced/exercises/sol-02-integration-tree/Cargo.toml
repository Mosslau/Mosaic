#
# 验证环境：rustc/cargo 1.92.0（macOS arm64，rustup 管理）；第三方依赖版本见 dev-dependencies 与 Cargo.lock。
# 验证状态：已验证（本机 cargo test / cargo bench 全绿；cargo fmt --check 干净、clippy --all-targets -- -D warnings 零告警）。
[package]
name = "sol-02-integration-tree"
version = "0.1.0"
edition = "2021"
publish = false

# exercises/练习 2 参考实现：集成测试目录组织 + 共享夹具 + 假引擎（fake）链路。
# tests/ 布局：
#   common/mod.rs       共享：日志构造辅助、TempFile 设备夹具、Engine 假引擎
#   replay_to_engine.rs 字节→假引擎的语义链路（Put 覆盖/Delete 删除/顺序）
#   io_roundtrip.rs     真实文件读回 + 假引擎应用（集成全链路）
#   corruption_stop.rs  损坏处停（engine 拿到前缀、后续不再调用）
# 质量闸门（在项目目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo test
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo clippy --all-targets -- -D warnings

[dependencies]
record-parser = { path = "../record-parser" }
