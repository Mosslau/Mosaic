[package]
name = "log-aggregator"
version = "0.1.0"
edition = "2021"
publish = false

# =====================================================================
# ph22 阶段项目：日志聚合性能优化（roadmap 第 22 节推荐项目落地）。
#
# 一个「从基准出发」的完整优化闭环：
#   基线版（逐行生成临时 String）→ 测量（criterion 时间 + 分配计数）
#   → 优化版（借用人 arena，避免临时分配）→ 再测量 → 输出 p50/p95 与分配对比。
#
# 目录：
#   src/line.rs          —— 日志行解析（借用实现，返回 &str 字段）
#   src/agg.rs           —— 两种聚合器：BaselineAgg（naive）与 OptimizedAgg
#   src/report.rs        —— 聚合报告 + p50/p95 百分位
#   src/counting.rs      —— 全局计数分配器（bin 的分配测量）
#   src/lib.rs           —— 公开 API
#   src/bin/measure.rs   —— 测量入口：时间 + p50/p95 + 分配次数的双版本对照
#   benches/agg_compare.rs —— criterion 基准（时间 + 吞吐）
#
# 验证环境：rustc/cargo 1.92.0（macOS arm64）；dev-dependencies criterion 0.8。
# 验证状态：已验证（cargo test / cargo bench / measure 均本机实测，数字见 README）。
#
# 构建/运行命令（在 project/log-aggregator 目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo test
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo build --release
#   /tmp/ph22-proj-target/release/measure [总行数 默认 200000]
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo bench --no-run
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo bench
# 质量闸门：
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph22-proj-target cargo clippy --all-targets -- -D warnings
# =====================================================================

[lib]
name = "log_aggregator"

[[bin]]
name = "measure"
path = "src/bin/measure.rs"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "agg_compare"
harness = false
