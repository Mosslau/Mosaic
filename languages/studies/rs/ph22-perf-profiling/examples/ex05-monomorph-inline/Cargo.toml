[package]
name = "ex05-monomorph-inline"
version = "0.1.0"
edition = "2021"
publish = false

# ex05：内联与单态化影响 —— enum/泛型静态分发 vs Box<dyn> 动态分发 vs inline 注解。
# 验证环境：rustc/cargo 1.92.0，无第三方依赖。
# 验证状态：已验证（本机实测差异见 README；注意差异随编译器版本/微架构浮动，
#   复现时以本机为准——这正是「先测量」的意义）。
# 构建/运行命令（在示例目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph22-ex05-target cargo build --release
#   /tmp/ph22-ex05-target/release/ex05-monomorph-inline [迭代次数，默认 5e8]
# 质量闸门：
#   CARGO_TARGET_DIR=/tmp/ph22-ex05-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph22-ex05-target cargo clippy --all-targets -- -D warnings
#   CARGO_TARGET_DIR=/tmp/ph22-ex05-target cargo test
