[package]
name = "sol-03-collections-compare"
version = "0.1.0"
edition = "2021"
publish = false

# sol-03：练习 3 参考实现 —— 同负载下 Vec / HashMap / BTreeMap 的性能对比。
# 验证环境：rustc/cargo 1.92.0；dev-dependencies criterion 0.8。
# 验证状态：已验证（本机 cargo test / cargo bench 全绿，数字见主文档 7 节）。
# 运行命令（本目录内）：
#   CARGO_TARGET_DIR=/tmp/ph22-ex-sol03-target cargo test
#   CARGO_TARGET_DIR=/tmp/ph22-ex-sol03-target cargo bench
# 质量闸门：
#   CARGO_TARGET_DIR=/tmp/ph22-ex-sol03-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph22-ex-sol03-target cargo clippy --all-targets -- -D warnings

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "collections"
harness = false
