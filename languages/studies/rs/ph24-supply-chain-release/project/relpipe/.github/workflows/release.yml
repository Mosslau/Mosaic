# .github/workflows/release.yml —— ph24-relpipe 发布流水线 CI（形态参考）
#
# 验证状态：本文件未在本环境运行（无 GitHub runner），YAML 为静态形态参考；
#   与本地 release-check.sh 的 9 个 step 一一对应（本地/CI 可互证，ph21 约定）。
# 使用要点：
#   - 触发：推送 v* tag 时执行「发布演练」；手动 workflow_dispatch 也可跑完整检查
#   - 真实的 cargo publish 需在仓库 Settings → Secrets 配 CRATES_IO_TOKEN（作用域最小化，3.7）
#   - cargo-audit / cargo-deny 用 taiki-e/install-action 安装（比 cargo install 快）

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release-check:
    name: release check (fmt/clippy/test/audit/deny/package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: relpipe-${{ hashFiles('project/relpipe/Cargo.lock') }}

      # ph24 兑现 ph21「预留注释位」：audit + deny 进流水线
      - name: Install cargo-audit & cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Run release-check.sh（本地/CI 同一脚本，结果可互证）
        working-directory: project/relpipe
        env:
          CRATES_IO_TOKEN_NEVER_LOG: ${{ secrets.CRATES_IO_TOKEN }}  # 仅占位演示，release-check 不读它
        run: |
          ./release-check.sh

  publish:
    name: publish to crates.io (on tag)
    needs: release-check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    permissions:
      contents: write   # 供打 release notes 用（最小权限：不给仓库其他写权限）
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}   # 平台 secret，永不进日志
        working-directory: project/relpipe
        run: cargo publish --allow-dirty

      - name: Generate SBOM & attach to release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sbom
      - name: cargo sbom（SPDX-2.3）作为 release asset 附随发布物
        working-directory: project/relpipe
        run: cargo sbom --output-format spdx_json_2_3 > sbom.spdx.json

      - name: Draft GitHub release（release notes 引用 CHANGELOG 对应小节）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: project/relpipe/CHANGELOG.md   # 简化演示；生产建议写独立 RELEASE_NOTES 或提取版本小节
          files: |
            project/relpipe/sbom.spdx.json
