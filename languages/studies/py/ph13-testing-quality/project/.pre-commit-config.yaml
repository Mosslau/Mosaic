# .pre-commit-config.yaml —— pre-commit 钩子示例（本环境未安装 pre-commit，未在本环境验证）
# 安装 pre-commit 后：pre-commit install && pre-commit run --all-files
# 本地等价验证：ruff check . && ruff format --check . && mypy telemetry_stats cli.py
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.17.1
    hooks:
      - id: mypy
        args: [telemetry_stats, cli.py]
