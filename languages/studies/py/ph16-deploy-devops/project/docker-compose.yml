# project/docker-compose.yml —— 服务 + Prometheus 监控的最小编排
# 验证环境目标：Docker Compose 的 `docker compose` 命令（v2 命令形态；本机 Compose CLI 在、
#   daemon 未启动——具体版本以本机 `docker compose version` 实测为准）
# 验证状态：语法已验证（`docker compose config` 离线解析通过，本机实测）；
#           未实际构建/启动（daemon 未启动）——在 daemon 可用的机器上：
#   # 1. 先在本机训出产物（或从发布物里拿）
#   python3 train.py   # 默认写 /tmp/health-api-model/model.joblib
#   # 2. 启动（把产物目录挂进容器）
#   docker compose up -d --build
#   # 3. 验证：服务健康 + Prometheus 抓到了指标
#   curl http://127.0.0.1:8000/ready
#   open http://127.0.0.1:9090  # Prometheus 的 Status → Targets 应看到 health-api UP

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /models/model.joblib
    volumes:
      - /tmp/health-api-model:/models:ro # 产物只读挂载（教学环境从 /tmp 拿；生产走制品库）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    # Grafana 衔接（主文档 3.7）：加 grafana/grafana 服务指向 prometheus 数据源即可，
    # 本模板聚焦「服务 + 指标抓取」闭环，看板留作练习
