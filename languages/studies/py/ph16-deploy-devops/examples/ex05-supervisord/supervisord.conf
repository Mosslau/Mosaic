; examples/ex05-supervisord/supervisord.conf —— Supervisor 守护 uvicorn（systemd 的等价物）
; 验证环境目标：Supervisor 4.x（pip install supervisor）+ Linux/macOS；本机未装 Supervisor，
;   未在本环境验证——按官方文档编写（systemd 版见同目录组 ex05-systemd-metrics/）
; 安装与运行（在装有 supervisor 的机器上）：
;   # 1. 主配置里 include 本文件（默认 /etc/supervisor/supervisord.conf 有
;   #    [include] files = /etc/supervisor/conf.d/*.conf），或复制到该目录
;   # 2. 启动 supervisord 并加载本程序
;   supervisord -c /etc/supervisor/supervisord.conf && supervisorctl reread && supervisorctl update
;   # 3. supervisorctl 常用命令表
;   #    supervisorctl status bhealth-api      # 看状态（RUNNING/EXITED/FATAL）
;   #    supervisorctl restart bhealth-api     # 手动重启（等于 systemctl restart）
;   #    supervisorctl stop bhealth-api        # 手动停止（autorestart=unexpected 不会拉起）
;   #    supervisorctl tail -f bhealth-api     # 跟日志（等于 journalctl -f）
;   # 4. 开机自启：supervisord 本身由系统服务拉起（Linux 上可用 systemd unit 包一层）

[program:bhealth-api]
command=/opt/bhealth-api/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/opt/bhealth-api
user=bhealth
autostart=true                 ; supervisord 启动时拉起（对应 systemd enable）
autorestart=unexpected         ; 异常退出才拉起（对应 Restart=on-failure）
startretries=3                 ; 连续拉起失败 3 次后标 FATAL（对应 StartLimitBurst 防爆拉）
stdout_logfile=/var/log/bhealth-api.log   ; Supervisor 自管日志（不进 journald）
environment=MODEL_PATH="/models/model.joblib"
