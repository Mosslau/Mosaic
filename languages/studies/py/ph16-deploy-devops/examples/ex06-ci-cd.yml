      #   run: |
      #     echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ghcr.io -u ci --password-stdin
      #     docker push ghcr.io/${{ github.repository }}/health-api:${{ github.sha }}
      #     # 部署：SSH 到服务器 docker compose pull && up -d，或触发 CD 平台
