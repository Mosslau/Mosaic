# exercises/pyproject.toml —— 本目录 ruff 校验基准（sol-*.py 与 examples/project 统一 lint/格式配置）
# 规则与 examples/pyproject.toml、project/pyproject.toml 一致：select E/F/I/UP/B、line-length 100
# 运行：ruff check . && ruff format --check .（本目录内执行）
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
