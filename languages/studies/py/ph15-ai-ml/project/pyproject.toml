# project/pyproject.toml —— 部件健康预测：依赖 + ruff / pytest 配置
[project]
name = "component-health"
version = "0.1.0"
description = "ph15 阶段项目：部件健康预测（HEALTH 回归 + 健康等级分类 + 模型保存/推理）"
requires-python = ">=3.11"
# 核心依赖：numpy + scikit-learn（含 joblib）；测试/门禁工具放 dev 依赖
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
