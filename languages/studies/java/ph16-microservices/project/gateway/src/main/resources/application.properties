# gateway 默认配置（测试用 --server.port=0 / --downstream.*-base-url 命令行参数覆盖——优先级高于本文件）
server.port=18313
# 与 user-service 共享的 JWT 密钥：user-service 用它签发、gateway 用它验签，两处必须一致
# （真实部署走配置中心/环境变量注入，不写进代码仓库）
jwt.secret=msdemo-dev-secret-0123456789abcdef0123456789abcdef
jwt.ttl-hours=2
# 路由表目标（转发控制器按路径前缀选择，见 GatewayProxyController.route）
downstream.user-service.base-url=http://localhost:18311
downstream.order-service.base-url=http://localhost:18312
management.endpoints.web.exposure.include=health,info
logging.level.com.example.msdemo=INFO
