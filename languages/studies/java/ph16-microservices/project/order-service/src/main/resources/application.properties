# order-service 默认配置（测试用 --server.port=0 / --user-service.base-url= 命令行参数覆盖——
# 命令行优先级高于本文件；注意 classpath 里多份 application.properties 时以先出现的为准，
# 所以跨模块起真实服务的测试一律用命令行参数传端口/地址，参照 examples/ex01 README 的踩坑记录）
server.port=18312
# user-service 地址：真实部署用配置中心/环境变量；测试用命令行 --user-service.base-url 覆盖
user-service.base-url=http://localhost:18311
management.endpoints.web.exposure.include=health,info
logging.level.com.example.msdemo=INFO
