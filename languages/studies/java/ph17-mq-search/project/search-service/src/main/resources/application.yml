# project/search-service 配置
# 验证状态：未在本环境验证（模式 A 无中间件可跑 memory 引擎；模式 B 需 docker compose 起 Kafka + ES，见 project/README.md）
server:
  port: 18080

app:
  # 索引引擎：memory（默认，无中间件可跑）/ es（真实 Elasticsearch 8.x，需 docker compose 起 ES）
  search:
    engine: memory
  es:
    host: localhost
    port: 9200

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: device-search-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual

logging:
  level:
    com.example.device.search: INFO
