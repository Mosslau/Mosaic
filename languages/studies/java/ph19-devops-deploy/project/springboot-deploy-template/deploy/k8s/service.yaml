# project/springboot-deploy-template/deploy/k8s/service.yaml
# ClusterIP 稳定入口（selector 对应 Deployment labels）。验证状态：未在本环境实际构建验证
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp
spec:
  selector:
    app: myapp
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
