{{/* examples/ex05-helm-chart/app-chart/templates/configmap.yaml —— 非敏感配置模板化（对应主文档 3.6） */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myapp.fullname" . }}-config
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
