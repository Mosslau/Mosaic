# examples/ex04-k8s-manifests/hpa.yaml
# HPA：按指标自动扩缩副本（对应主文档 3.5 对象表 + 3.12 发布与容量）
# 教学点：扩容对象是 Deployment 的副本数 —— 新副本由控制器创建、由 Service 自动接流量，无需人工介入；
#         metrics 是「平均值」语义：所有 Pod 当前 CPU 均值 / 目标值 → 目标副本数
# 前置：集群装有 metrics-server（提供 CPU 指标），否则 HPA 无法取数、不扩缩
# 验证命令（有 kubectl 的环境）：
#   kubectl apply -f hpa.yaml
#   kubectl get hpa myapp -n myapp
#   # 压测观察扩缩：kubectl run -it --rm load --image=busybox -n myapp -- sh -c \
#   #   "while true; do wget -q -O- http://myapp/actuator/health >/dev/null; done"
# 验证状态：未在本环境实际构建验证（本机无 kubectl/集群）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
  namespace: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myapp
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # 平均 CPU 超 60% 就扩容，低于再缩
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # 缩容要稳：指标好转后等 5 分钟再缩，防抖动
