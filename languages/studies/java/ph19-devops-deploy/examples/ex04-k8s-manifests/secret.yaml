# examples/ex04-k8s-manifests/secret.yaml
# 敏感配置单独放 Secret（不回 git、不进镜像）。本文件用 stringData 明文便于教学；
# 生产环境用外部 Secret 方案（ExternalSecrets/云厂商 KMS/Vault）把明文挡在仓库外。
# 注意：base64 不是加密，只是编码 —— 本文件的 value 明文写是为演示结构，别照抄到公开仓库。
# 验证命令（有 kubectl 的环境）：
#   kubectl apply -f secret.yaml
#   kubectl get secret myapp-secret -n myapp -o yaml   # 显示的是 base64 编码值
# 验证状态：未在本环境实际构建验证（本机无 kubectl/集群）
apiVersion: v1
kind: Secret
metadata:
  name: myapp-secret
  namespace: myapp
type: Opaque
stringData:
  DB_PASSWORD: "app123"       # 教学明文；生产用 printf 'app123' | kubectl create secret generic ... --from-file=...
  REDIS_PASSWORD: "redis123"
