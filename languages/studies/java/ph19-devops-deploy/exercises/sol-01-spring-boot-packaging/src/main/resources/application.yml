# exercises/sol-01-spring-boot-packaging/src/main/resources/application.yml
# 练习 1 参考实现的部署配置（对应主文档 3.2/3.5/3.10/3.11）
# 验证状态：未在本环境验证（需真 Boot 应用运行；属性均为 Boot 3.3 官方属性）
server:
  port: 8080
  shutdown: graceful                      # SIGTERM 优雅停机（3.11）
spring:
  application:
    name: myapp
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # 给 Prometheus 抓（3.10）
  endpoint:
    health:
      probes:
        enabled: true                     # 开放 /actuator/health/liveness|readiness（3.5/3.11）
  metrics:
    tags:
      application: ${spring.application.name}
