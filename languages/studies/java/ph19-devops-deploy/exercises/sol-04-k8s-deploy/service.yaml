# exercises/sol-04-k8s-deploy/service.yaml —— 练习 4 参考实现（对应主文档 3.5）
# selector 与 deployment template labels 的 app: myapp 对应
# 验证状态：未在本环境实际构建验证
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp
spec:
  selector:
    app: myapp
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
