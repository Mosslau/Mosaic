{{/* examples/ex05-helm-chart/app-chart/templates/secret.yaml —— 敏感配置（教学向：值在 values.secret；生产应改用外部 Secret 方案） */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-secret
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
