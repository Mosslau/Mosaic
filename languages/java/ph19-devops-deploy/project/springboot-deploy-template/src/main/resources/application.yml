# project/springboot-deploy-template/src/main/resources/application.yml
# 部署相关配置：优雅停机 / 探针端点 / prometheus（对应主文档 3.2/3.5/3.10/3.11）
# 验证状态：未在本环境验证（需真 Boot 应用运行；属性均为 Boot 3.3 官方属性）
server:
  port: 8080
  shutdown: graceful                    # SIGTERM 后优雅停机（3.11）
spring:
  application:
    name: myapp
  lifecycle:
    timeout-per-shutdown-phase: 30s     # 优雅停机每阶段最多等 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true                   # 开放 /actuator/health/liveness 与 /actuator/health/readiness
  metrics:
    tags:
      application: ${spring.application.name}
