# 基础配置（dev/prod 共享）——注意：.properties 文件按 ISO-8859-1 读取（Java 特性），
# 值里的非 ASCII 字符需 \uXXXX 转义；本示例刻意用 ASCII 值 + 中文注释教学（中文文案在 main 文档展示）。
# 默认激活 dev（命令行可用 --spring.profiles.active=prod 覆盖）
spring.profiles.active=dev
app.greeting.message=base-greeting
app.greeting.feature-enabled=false

# 信息端点内容（/actuator/info 展示 info.* 属性；env 收集器默认关闭，需显式打开）
info.app.name=ph15-ex02-profile-actuator
info.app.env=base
management.info.env.enabled=true

# 暴露哪些 actuator 端点（默认只暴露 health；这里显式放行 health 与 info）
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
