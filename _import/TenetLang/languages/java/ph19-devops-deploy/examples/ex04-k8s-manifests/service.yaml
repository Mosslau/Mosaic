# examples/ex04-k8s-manifests/service.yaml
# Service：给一组 Pod 稳定的访问入口（Pod IP 会随重建变化，Service 名/DNS 不变）
# 教学点：selector 按 label 挑 Pod —— 发布/扩缩容都不需要动 Service（Pod 一直在变，入口不变）
# type=ClusterIP：集群内可达；外部流量经 Ingress/Nginx（主文档 3.7）
# 验证命令（有 kubectl 的环境）：
#   kubectl apply -f service.yaml
#   kubectl get svc myapp -n myapp
#   kubectl run -it --rm probe --image=curlimages/curl -n myapp -- curl -fsS http://myapp/actuator/health
# 验证状态：未在本环境实际构建验证（本机无 kubectl/集群）
apiVersion: v1
kind: Service
metadata:
  name: myapp
  namespace: myapp
spec:
  selector:
    app: myapp                     # 与 Deployment template 的 labels 对应
  type: ClusterIP
  ports:
    - name: http
      port: 80                     # Service 端口（集群内访问 myapp:80）
      targetPort: http             # 转发到容器的名为 http 的端口（8080）
