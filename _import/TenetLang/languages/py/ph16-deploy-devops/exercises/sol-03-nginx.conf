# exercises/sol-03-nginx.conf —— 练习 3 参考实现：Nginx 反向代理（带限流与 WebSocket 透传）
# 验证环境目标：Nginx 1.24+（本机 Homebrew nginx 1.31.2）
# 验证状态：语法已验证（本机实测 `nginx -t -c <本文件>` 通过；include mime.types 按配置
#   文件所在目录解析，本机验证时临时从 /opt/homebrew/etc/nginx/ 拷贝了一份到本目录，
#   生产上 nginx 包自带的 conf 目录里已有）；未起真实反代链路
# 题目要求对照：proxy_pass 反代 ✓、客户端真实 IP 透传头 ✓、/health 直通（不走限流）✓、
#   限流 zone ✓、WebSocket 升级头 ✓

worker_processes auto;
pid /tmp/sol03-nginx.pid;
error_log /tmp/sol03-nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /tmp/sol03-nginx-access.log;

    # 限流：按客户端 IP 每桶 10 req/s（突发 20）。zone 放 http 块，limit_req 放 location
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    upstream app_pool {
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
        keepalive 32;
    }

    # WebSocket 升级需要的 Connection 头映射（FastAPI 的 ws 端点走这里）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8080;

        # 健康检查直通：探针流量不该被限流误伤，也不用透传一堆头
        location = /health {
            proxy_pass http://app_pool;
        }

        location /ws/ {
            proxy_pass http://app_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;  # 长连接别被默认 60s 掐断
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://app_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
