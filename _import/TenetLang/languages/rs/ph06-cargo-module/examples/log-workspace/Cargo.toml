# 根 Cargo.toml —— 虚拟清单：只声明 workspace，不包含任何 package
# 来源：languages/rs/ph06-cargo-module/06-cargo-module.md 第 6 章示例 5
# 验证环境：rustc 1.92.0 + cargo 1.92.0，纯标准库
# 编译：cargo build --workspace（在本目录执行）
# 运行：cargo run -p log-cli
# 测试：cargo test --workspace
# 验证状态：已验证（rustc 1.92.0）

[workspace]
resolver = "2"
members = ["crates/log-parser", "crates/log-aggregator", "crates/log-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
