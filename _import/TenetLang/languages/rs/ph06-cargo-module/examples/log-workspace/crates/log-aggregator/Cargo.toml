# examples/log-workspace/crates/log-aggregator/Cargo.toml —— 示例 5 成员 crate：聚合库（path 依赖 log-parser）
# 来源：languages/rs/ph06-cargo-module/06-cargo-module.md 第 6 章示例 5
# 验证环境：rustc 1.92.0 + cargo 1.92.0，纯标准库，继承根 workspace 元数据
# 编译：cargo build --workspace；测试：cargo test -p log-aggregator（在 log-workspace/ 目录执行）
# 验证状态：已验证（rustc 1.92.0）
[package]
name = "log-aggregator"
version.workspace = true
edition.workspace = true

[dependencies]
log-parser = { path = "../log-parser" }
