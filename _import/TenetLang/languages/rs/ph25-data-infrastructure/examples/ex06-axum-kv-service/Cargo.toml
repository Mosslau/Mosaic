[package]
name = "ex06-axum-kv-service"
version = "0.1.0"
edition = "2021"
description = "ph25 ex06：Axum 暴露 KV/range-scan HTTP 服务（网络依赖示例）"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
