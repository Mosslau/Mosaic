#
# 验证环境：rustc/cargo 1.92.0（macOS arm64，rustup 管理）；第三方依赖版本见 dev-dependencies 与 Cargo.lock。
# 验证状态：已验证（本机 cargo test / cargo bench 全绿；cargo fmt --check 干净、clippy --all-targets -- -D warnings 零告警）。
[package]
name = "ex05-criterion-bench"
version = "0.1.0"
edition = "2021"
publish = false

# examples/ex05：criterion 基准测试（对比零拷贝 vs 复制的解析路径）。
# 噪声控制配置见 benches/parse_compare.rs（为教学演示提速调小采样，正式验收建议放宽）。
# 质量闸门（在项目目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench -- --help        # 看 criterion CLI 全量参数
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench -- --save-baseline v1   # 记录回归基线
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo bench -- --baseline v1        # 与旧基线对比
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo clippy --all-targets -- -D warnings

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "parse_compare"
harness = false
