#
# 验证环境：rustc/cargo 1.92.0（macOS arm64，rustup 管理）；第三方依赖版本见 dev-dependencies 与 Cargo.lock。
# 验证状态：已验证（本机 cargo test / cargo bench 全绿；cargo fmt --check 干净、clippy --all-targets -- -D warnings 零告警）。
[package]
name = "sol-03-proptest-boundary"
version = "0.1.0"
edition = "2021"
publish = false

# exercises/练习 3 参考实现：用 proptest 测边界输入。
# - 自定义策略（tests/common/mod.rs）：合法 record 的 key/value 长度贴着
#   0/64/MAX 附近生成，任意字节、任意日志组合；
# - 性质（tests/properties.rs）：任意字节不 panic；roundtrip 逐字段相等；
#   klen 越上限报 TooLarge；编码出的字节能被自己解析（roundtrip 自洽）。
# 质量闸门（在项目目录内执行）：
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo test
#   PROPTEST_CASES=2048 CARGO_TARGET_DIR=/tmp/ph20-target cargo test    # 调大轰炸量
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo fmt --check
#   CARGO_TARGET_DIR=/tmp/ph20-target cargo clippy --all-targets -- -D warnings

[dependencies]
record-parser = { path = "../record-parser" }

[dev-dependencies]
proptest = "1"
